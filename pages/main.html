<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="header-container" id="header">
                <h1>KINOMONSTER</h1>
                <form class="input-wrapper form" action="/pages/search_results.html" method="get">
                    <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path fill-rule="evenodd" clip-rule="evenodd" d="M13.1243 7.49926C13.1243 8.23795 12.9788 8.9694 12.6961 9.65186C12.4134 10.3343 11.9991 10.9544 11.4767 11.4767C10.9544 11.9991 10.3343 12.4134 9.65186 12.6961C8.9694 12.9788 8.23795 13.1243 7.49926 13.1243C6.76058 13.1243 6.02912 12.9788 5.34667 12.6961C4.66421 12.4134 4.04412 11.9991 3.52179 11.4767C2.99946 10.9544 2.58512 10.3343 2.30244 9.65186C2.01976 8.9694 1.87426 8.23795 1.87426 7.49926C1.87426 6.00742 2.46689 4.57668 3.52179 3.52179C4.57668 2.46689 6.00742 1.87426 7.49926 1.87426C8.99111 1.87426 10.4218 2.46689 11.4767 3.52179C12.5316 4.57668 13.1243 6.00742 13.1243 7.49926ZM12.0993 13.4243C10.5922 14.5942 8.69597 15.1459 6.79651 14.9669C4.89705 14.788 3.13719 13.8919 1.8752 12.461C0.613204 11.0302 -0.0560502 9.17214 0.00367996 7.2652C0.0634101 5.35826 0.847635 3.54577 2.1967 2.1967C3.54577 0.847635 5.35826 0.0634101 7.2652 0.00367996C9.17214 -0.0560502 11.0302 0.613204 12.461 1.8752C13.8919 3.13719 14.788 4.89705 14.9669 6.79651C15.1459 8.69597 14.5942 10.5922 13.4243 12.0993L16.9118 15.5868C17.0039 15.6726 17.0777 15.7761 17.129 15.8911C17.1802 16.0061 17.2078 16.1302 17.21 16.2561C17.2122 16.382 17.1891 16.507 17.1419 16.6238C17.0948 16.7405 17.0246 16.8465 16.9356 16.9356C16.8465 17.0246 16.7405 17.0948 16.6238 17.1419C16.507 17.1891 16.382 17.2122 16.2561 17.21C16.1302 17.2078 16.0061 17.1802 15.8911 17.129C15.7761 17.0777 15.6726 17.0039 15.5868 16.9118L12.0993 13.4243Z" fill="#151515" fill-opacity="0.28"/>
                    </svg>
                    <input class="header-input" type="text" placeholder="Поиск..." name="query" required>
                </form>
            </div>      
        </div>
    </header>
    <main>
        <div class="container">
            <section class="promo">
                <div class="promo-info">
                    <h3>УЖЕ В КИНО</h3>
                    <a class="promo-button">Смотреть</a>    
                </div>
                <div class="promo-banner">
                </div>
            </section>
            <section class="movies">
                <div class="movies-header">
                    <nav class="movies-nav">
                        <button id="popular-films" class="tab active" data-section="movies">Популярные фильмы</button>
                        <button id="popular-series" class = "tab" data-section="series">Популярные сериалы</button>
                        <button id="top-films" class = "tab" data-section="collection">Подборка фильмов</button>
                    </nav>
                </div>
                <div class="movies-toolbar">
                    <a class="movies-all">
                        <span>Смотреть все</span>
                        <span>></span>
                    </a>
                </div>
                <div class="movies-grid">
                </div>
            </section>
            <section class="movies-category">
                <h3 class="category-title tab active">Фильмы по категориям</h3>
                <div class="filters">
                    <select name="genres.name">
                        <option value="">Все жанры</option>
                        <option value="ужасы">Ужасы</option>
                        <option value="драма">Драма</option>
                        <option value="комедия">Комедия</option>
                    </select>
                    <select name="countries.name">
                        <option value="">Все страны</option>
                        <option value="Россия">Россия</option>
                        <option value="США">США</option>
                    </select>
                    <select name="year">
                        <option value="">Любой год</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                    </select>
                    <select name="rating.imdb">
                        <option value="">Оценка IMDb</option>
                        <option value="4-10">от 4</option>
                        <option value="7-10">от 7</option>
                    </select>
                    <div class="filters-sort">
                        <button class="arrow up" aria-label="По возрастанию"></button>
                        <button class="arrow down" aria-label="По убыванию"></button>
                    </div>
                </div>
                <div class="movies-toolbar">
                    <a class="movies-all">
                        <span>Смотреть все</span>
                        <span>></span>
                    </a>
                </div>
                <div class="movies-grid">
                </div>
            </section>
        </div>
    </main>
    <footer>
        <div class="container">
            <div class="footer-section">
                <h1>KINOMONSTER</h1>
                <div class="footer-links">
                    <ul>
                        <li><a href="#header" data-section="movies">Главная</a></li>
                        <li><a href="#popular-films" data-section="movies">Популярные фильмы</a></li>
                        <li><a href="#popular-series" data-section="series">Популярные сериалы</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </footer>
    <script type="module" src="/js/index.js"></script>
</body>
</html>
